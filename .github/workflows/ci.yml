name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Fork PRs run on GitHub's free runner, so a stranger's PR never spends Blacksmith minutes (FLT-103). Same-repo
    # PRs and main stay on Blacksmith.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # FLT-106: the sim must play out the same on every JS engine (replays, ?challenge= links and saves rely on it). Runs
  # the golden busy-player replay on Node 22 and Node 26 and in Playwright's Chromium (V8), Firefox (SpiderMonkey) and
  # WebKit (JavaScriptCore), hashing the whole World every 10 ticks; any difference fails with the tick and the field.
  engines:
    permissions:
      contents: read
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: echo "NODE_NEXT=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm engines --node "$NODE_NEXT" --engines chromium,firefox,webkit
