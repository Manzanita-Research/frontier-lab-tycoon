name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  check:
    if: github.event.action != 'closed' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infra install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --dir infra typecheck

  deploy:
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Today's Drama (FLT-34) publishes the packs in origin/main's tree, never the branch's: the build needs main.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infra install --frozen-lockfile
      - name: Skip stale commits and closed PRs
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const expected = context.payload.pull_request?.head.sha ?? context.sha;
            let current;
            if (context.eventName === 'pull_request') {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
              current = pr.state === 'open' && pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.sha === expected;
            } else {
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              current = branch.commit.sha === expected;
            }
            core.setOutput('deploy', String(current));
            if (!current) core.notice('Skipping a superseded commit or closed preview.');
      - name: Deploy assets with Alchemy
        if: steps.current.outputs.deploy == 'true'
        run: pnpm --dir infra exec alchemy deploy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
          DEPLOY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          # Accounts (FLT-67, docs/ACCOUNTS.md): off until the repo variable FLT_AUTH=on, and prod only. The secrets
          # reach only a production deploy with the flag on; everywhere else they are empty strings.
          FLT_AUTH: ${{ vars.FLT_AUTH }}
          BETTER_AUTH_SECRET: ${{ vars.FLT_AUTH == 'on' && github.event_name == 'push' && secrets.BETTER_AUTH_SECRET || '' }}
          HF_CLIENT_ID: ${{ vars.FLT_AUTH == 'on' && github.event_name == 'push' && secrets.HF_CLIENT_ID || '' }}
          HF_CLIENT_SECRET: ${{ vars.FLT_AUTH == 'on' && github.event_name == 'push' && secrets.HF_CLIENT_SECRET || '' }}

      - name: Read the deployed preview URL
        if: github.event_name == 'pull_request' && steps.current.outputs.deploy == 'true'
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const revision = context.payload.pull_request.head.sha.slice(0, 7);
            const comment = comments.reverse().find(c => c.body.includes('## Preview deployed') && c.body.includes(revision));
            const url = comment?.body.match(/\[Play this preview\]\((https:\/\/[^)]+)\)/)?.[1];
            if (!url) throw new Error('No preview URL for the deployed revision');
            core.setOutput('url', url);

  stranger:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.preview_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Play the deployed preview as a stranger
        run: pnpm e2e:stranger --url "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stranger-${{ github.event.number }}
          path: e2e/results/

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm --dir infra install --frozen-lockfile
      - name: Refuse production destruction
        run: |
          if [ "$STAGE" = "prod" ] || ! [[ "$STAGE" =~ ^pr-[1-9][0-9]*$ ]]; then
            printf '%s\n' 'ERROR: cleanup only accepts pr-<number>; cannot destroy prod.' >&2
            exit 1
          fi
      - name: Skip reopened PRs
        id: closed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.setOutput('destroy', String(pr.state === 'closed'));
      - name: Destroy preview with Alchemy
        if: steps.closed.outputs.destroy == 'true'
        run: pnpm --dir infra exec alchemy destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
