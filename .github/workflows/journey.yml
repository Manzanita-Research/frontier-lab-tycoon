name: Journey

# The journey test (FLT-53): a new player plays Level 1 to 5 of a deployed build. It is long (about 10 minutes of
# play on a fast runner, capped at 60), so it runs nightly against prod and by hand against any URL, never per PR.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "The build to play (no params), e.g. https://pr-60-flt-prod.manzanita.workers.dev"
        required: true
        default: "https://flt-prod.manzanita.workers.dev"
      minutes:
        description: "Wall-clock cap, in minutes"
        required: false
        default: "60"
      phone:
        description: "Play on a phone (FLT-61): 390×844, touch only, with the phone checks"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CI: "true"

jobs:
  journey:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Play Level 1 to 5
        run: pnpm e2e:journey --url "$JOURNEY_URL" --minutes "$JOURNEY_MINUTES" ${{ inputs.phone && '--phone' || '' }}
        env:
          JOURNEY_URL: ${{ inputs.url || 'https://flt-prod.manzanita.workers.dev' }}
          JOURNEY_MINUTES: ${{ inputs.minutes || '60' }}
      - name: Summary
        if: always()
        run: test -f e2e/results/journey/report.md && cat e2e/results/journey/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: journey${{ inputs.phone && '-phone' || '' }}-${{ github.run_id }}
          path: e2e/results/journey/
